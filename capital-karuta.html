<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAPITAL KARUTA｜首都かるた</title>
<style>
:root{color-scheme:light;--bg:#f4f6f9;--card:#fff;--panel:#eff3f8;--text:#202d3b;--muted:#697889;--border:#dce3ec;--accent:#1769c2;--green:#168558}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:720px;margin:20px auto;padding:0 12px 24px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:0 3px 16px #1b33450b}
.top,.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12px}.heading{font-size:22px;font-weight:800}
.track{height:6px;border-radius:99px;background:var(--panel);overflow:hidden}.track>div{height:100%;width:0;background:var(--green);transition:width .2s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{background:var(--panel);border-radius:10px;text-align:center;padding:9px 3px}.stat strong{font-size:23px;display:block;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted)}
.reader{background:var(--panel);border-radius:12px;padding:14px 10px;text-align:center;display:grid;gap:9px;min-height:140px;align-content:center}.sentence{font-size:clamp(17px,4vw,22px);font-weight:750;line-height:1.5;min-height:42px;overflow-wrap:anywhere}.clockline{height:4px;background:var(--border);border-radius:8px;overflow:hidden}.clockline>div{height:100%;width:0;background:var(--green)}.status{color:var(--muted);font-size:12px;min-height:20px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 3px;min-height:68px;line-height:1.3;font-size:clamp(11px,2.8vw,14px);font-weight:650;overflow-wrap:anywhere;cursor:pointer;touch-action:manipulation}.tile:disabled{cursor:default}.tile:not(:disabled):active{transform:scale(.97)}.tile.bad{border-color:#c9694e;background:#cd694b2e}.tile.good{border:2px solid var(--green);background:#16a76524}.tile.bye{border:2px solid var(--green);background:#16a76535}
.buttons{display:flex;gap:8px}.btn{flex:1;font:inherit;font-weight:700;font-size:14px;padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}.btn:disabled{opacity:.45;cursor:default}.hidden{display:none!important}.results{text-align:center;padding:18px 8px;display:grid;gap:12px}
@media(min-width:550px){.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.tile{min-height:76px}}@media(max-width:365px){.panel{padding:10px}.cards{gap:5px}.tile{min-height:60px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111820;--card:#1d2731;--panel:#283541;--text:#edf3fa;--muted:#b2c0cb;--border:#40505e;--accent:#377fd3;--green:#4cce99}}
</style>
</head>
<body>
<main>
<div class="panel">
  <div class="top"><div><div class="muted">WORLD CAPITALS · REVIEW</div><div class="heading">首都かるた</div></div><div class="muted" id="turn">第1問</div></div>
  <div class="spread"><span class="muted">卒業した首都</span><strong id="mastered" style="font-size:13px">0 / 20</strong></div>
  <div class="track"><div id="progress"></div></div>
  <div class="stats"><div class="stat"><strong id="early">0</strong><span>先取り成功</span></div><div class="stat"><strong id="late">0</strong><span>先取り失敗</span></div><div class="stat"><strong id="wrong">0</strong><span>お手つき</span></div></div>
  <div id="play" style="display:grid;gap:12px"><div class="reader"><div class="spread"><span class="muted">読み札</span><span class="muted" id="clock">開始前</span></div><div class="sentence" id="sentence">準備ができたらスタート！</div><div class="clockline"><div id="timefill"></div></div><div class="status" id="status" aria-live="polite">2回連続で先取りすると卒業</div></div><div class="cards" id="cards"></div><div class="buttons"><button class="btn primary" id="start">スタート</button><button class="btn" id="reset">最初から</button></div></div>
  <div id="finish" class="results hidden"><div style="font-size:36px">🏆</div><div style="font-size:23px;font-weight:800">全20か国を卒業！</div><div id="summary" style="font-size:14px;line-height:1.9"></div><button class="btn primary" id="again">もう一度遊ぶ</button></div>
  <div class="muted" style="text-align:center;line-height:1.65">常に12枚の札を表示。未習得の問題が減ったら卒業済みの札をダミーとして補充します。</div>
</div>
</main>
<script src="capital-karuta.js"></script>
</body>
</html>
